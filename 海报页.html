  .sheet { width: 210mm; min-height: 297mm; background: #fff; border-radius: 6px;

    position: relative; z-index: 1; }
  .meta { margin-top: 9mm; width: 100%; display: flex; flex-direction: column; gap: 2.5mm;

  .meta div b { flex: none; width: 26mm; color: #17324a; font-weight: 700; }
